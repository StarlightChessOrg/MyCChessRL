[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mycchess-rl"
version = "0.1.0"
description = "中国象棋 RL：XQWL C++ 环境、联合策略网络、PPO、cbf 监督学习、网页对弈"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "xmltodict>=0.13",
]

[project.optional-dependencies]
play = ["sanic>=23.12"]
dev = ["pytest>=7.0"]

[project.scripts]
mycchess-train-ppo = "mycchess_rl.train_ppo:main"
mycchess-train-sl = "mycchess_rl.train_sl:main"
mycchess-play-web = "mycchess_rl.play_web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mycchess_rl*"]
